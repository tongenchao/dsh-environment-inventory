# dsh profile patch layer (ascii-only)
# Enabled plugins
- insert:
    # schedule tools
    - id: schedule
      name: '@deepseek-ai/dsh-schedule'

    # time context
    - id: time-context
      name: '@deepseek-ai/dsh-time-context'
      config:
        timeZone: Asia/Shanghai
        refreshIntervalMs: 60000

